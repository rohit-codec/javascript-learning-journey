<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <p class="tag">PHASE 2 PROJECT</p>
        <h1>Registration Form</h1>
        <p class="muted">Practice project for JavaScript Phase 2.</p>
        <section class="card">
            <form id="form"><label>Name<input id="name" required></label><label>Email<input id="email"
                        required></label><label>Password<input id="password" type="password"
                        required></label><label>Confirm password<input id="confirm" type="password"
                        required></label><button>Validate registration</button></form>
            <p id="message" role="status"></p>
        </section>
        <footer>HTML · CSS · JavaScript</footer>
    </main>
</body>

</html>
