<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dynamic To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <p class="tag">PHASE 2 PROJECT</p>
        <h1>Dynamic To-Do List</h1>
        <p class="muted">Practice project for JavaScript Phase 2.</p>
        <section class="card">
            <form id="form"><input id="task" required placeholder="New task"><button>Add task</button></form>
            <p id="count">0 tasks</p>
            <ul id="list"></ul>
        </section>
        <footer>HTML · CSS · JavaScript</footer>
    </main>
</body>

</html>
