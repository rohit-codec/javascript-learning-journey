<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Contact Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <p class="tag">PHASE 2 PROJECT</p>
        <h1>Smart Contact Manager</h1>
        <p class="muted">Practice project for JavaScript Phase 2.</p>
        <section class="card">
            <form id="form"><input id="name" required placeholder="Name"><input id="email" required
                    placeholder="Email"><input id="phone" required placeholder="Phone"><button>Add contact</button>
            </form><input id="search" placeholder="Search contacts"><button id="export" type="button">Export
                JSON</button>
            <p id="message"></p>
            <ul id="list"></ul>
        </section>
        <footer>HTML · CSS · JavaScript</footer>
    </main>
</body>

</html>
