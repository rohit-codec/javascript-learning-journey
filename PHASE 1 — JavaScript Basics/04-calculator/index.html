<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Everyday Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <p class="tag">JAVASCRIPT PROJECT 04</p>
        <h1>Everyday Calculator</h1>
        <section class="calc">
            <div class="display">
                <p id="status">Ready</p><output id="display">0</output>
            </div>
            <div class="keys"><button data-action="clear" class="utility">AC</button><button data-action="back"
                    class="utility">⌫</button><button data-value="% " class="utility">%</button><button data-value="/"
                    class="operator">÷</button><button data-value="7">7</button><button data-value="8">8</button><button
                    data-value="9">9</button><button data-value="*" class="operator">×</button><button
                    data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button
                    data-value="-" class="operator">−</button><button data-value="1">1</button><button
                    data-value="2">2</button><button data-value="3">3</button><button data-value="+"
                    class="operator">+</button><button data-action="sign">+/−</button><button
                    data-value="0">0</button><button data-value=".">.</button><button data-action="equals"
                    class="equals">=</button></div>
        </section>
        <p class="hint">Keyboard: numbers, operators, Enter, Backspace, Escape.</p>
        <footer>HTML · CSS · JavaScript</footer>
    </main>
</body>

</html>
